<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Search & Analyzer — Explorer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --badge-debug: #64748b;
      --badge-info: #0ea5e9;
      --badge-warn: #eab308;
      --badge-error: #ef4444;
      --badge-crit: #b91c1c;
      --code-bg: #090d16;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .badge-api { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .header-links a { color: var(--accent); text-decoration: none; font-size: 14px; margin-left: 16px; font-weight: 500; }
    .header-links a:hover { text-decoration: underline; }

    /* Filter Card */
    .filter-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 8px 12px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    .filter-actions { display: flex; gap: 12px; align-items: center; justify-content: flex-end; }
    button { cursor: pointer; border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 600; border: none; transition: background 0.15s; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--border); color: #fff; }
    .btn-secondary:hover { background: #475569; }

    /* Results table */
    .results-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .results-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: rgba(0, 0, 0, 0.2); padding: 12px 16px; font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    /* Badges */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-DEBUG { background: #334155; color: #cbd5e1; }
    .badge-INFO { background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-WARN { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
    .badge-ERROR { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
    .badge-CRITICAL { background: #b91c1c; color: #fee2e2; }

    .req-id { font-family: monospace; font-size: 12px; color: var(--accent); background: rgba(56, 189, 248, 0.1); padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    .req-null { color: #64748b; font-style: italic; }
    .msg { font-family: monospace; white-space: pre-wrap; word-break: break-all; color: #e2e8f0; }
    .ts { color: var(--text-muted); white-space: nowrap; font-family: monospace; }
    .svc { font-weight: 600; color: #cbd5e1; white-space: nowrap; }

    /* Pagination */
    .pagination-bar { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); }
    .pagination-controls { display: flex; gap: 8px; align-items: center; }
    .empty-state { padding: 48px 24px; text-align: center; color: var(--text-muted); font-size: 15px; }
    .loading { text-align: center; padding: 36px; color: var(--accent); }
    .error-banner { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--badge-error); color: #fca5a5; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Log Search & Analyzer <span class="badge-api">Role 2 API Lead</span></h1>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">High-performance structured log search, indexing & pagination</p>
      </div>
      <div class="header-links">
        <a href="/docs" target="_blank">Interactive Swagger Docs</a>
        <a href="/api/health" target="_blank">Health Check</a>
      </div>
    </header>

    <div id="error-banner" class="error-banner"></div>

    <!-- Filters Panel -->
    <div class="filter-panel">
      <div class="filter-grid">
        <div class="form-group">
          <label for="severity-input">Severity</label>
          <select id="severity-input">
            <option value="">All Severities</option>
            <option value="DEBUG">DEBUG</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
            <option value="CRITICAL">CRITICAL</option>
          </select>
        </div>

        <div class="form-group">
          <label for="request-id-input">Exact Request ID</label>
          <input type="text" id="request-id-input" placeholder="e.g. req-8f3k2">
        </div>

        <div class="form-group">
          <label for="from-input">From (ISO timestamp)</label>
          <input type="datetime-local" id="from-input">
        </div>

        <div class="form-group">
          <label for="to-input">To (ISO timestamp)</label>
          <input type="datetime-local" id="to-input">
        </div>

        <div class="form-group">
          <label for="limit-input">Page Size</label>
          <select id="limit-input">
            <option value="10">10 entries</option>
            <option value="25">25 entries</option>
            <option value="50" selected>50 entries (Default)</option>
            <option value="100">100 entries (Max)</option>
          </select>
        </div>
      </div>

      <div class="filter-actions">
        <button class="btn-secondary" id="reset-btn">Reset Filters</button>
        <button class="btn-primary" id="search-btn">Search Logs</button>
      </div>
    </div>

    <!-- Results Panel -->
    <div class="results-card">
      <div class="results-header">
        <div id="results-count" style="font-weight: 600;">Showing logs...</div>
        <div id="endpoint-url" style="color: var(--text-muted); font-family: monospace; font-size: 12px;"></div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 60px;">ID</th>
              <th style="width: 180px;">Timestamp</th>
              <th style="width: 100px;">Severity</th>
              <th style="width: 150px;">Service</th>
              <th style="width: 160px;">Request ID</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="logs-table-body">
            <tr><td colspan="6" class="loading">Loading logs...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination-bar">
        <div id="page-info" style="font-size: 13px; color: var(--text-muted);">Page 1</div>
        <div class="pagination-controls">
          <button class="btn-secondary" id="prev-btn" disabled>&larr; Previous</button>
          <button class="btn-secondary" id="next-btn" disabled>Next &rarr;</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentPage = 1;

    async function fetchLogs(page = 1) {
      currentPage = page;
      const severity = document.getElementById("severity-input").value;
      const requestId = document.getElementById("request-id-input").value.trim();
      const fromVal = document.getElementById("from-input").value;
      const toVal = document.getElementById("to-input").value;
      const limit = document.getElementById("limit-input").value;

      const params = new URLSearchParams();
      if (severity) params.append("severity", severity);
      if (requestId) params.append("request_id", requestId);
      if (fromVal) params.append("from", new Date(fromVal).toISOString());
      if (toVal) params.append("to", new Date(toVal).toISOString());
      params.append("page", page);
      params.append("limit", limit);

      const url = `/api/logs?${params.toString()}`;
      document.getElementById("endpoint-url").textContent = url;
      hideError();

      const tbody = document.getElementById("logs-table-body");
      tbody.innerHTML = '<tr><td colspan="6" class="loading">Fetching logs from server...</td></tr>';

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || "Error loading logs");
          tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Request failed. Check error above.</td></tr>';
          return;
        }

        renderLogs(data);
      } catch (err) {
        showError("Failed to communicate with API server: " + err.message);
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Network or connection error.</td></tr>';
      }
    }

    function renderLogs(data) {
      const tbody = document.getElementById("logs-table-body");
      const countEl = document.getElementById("results-count");
      const pageInfo = document.getElementById("page-info");
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");

      countEl.textContent = `Total matching: ${data.total} records`;
      const totalPages = Math.max(1, Math.ceil(data.total / data.limit));
      pageInfo.textContent = `Page ${data.page} of ${totalPages} (${data.entries.length} entries shown)`;

      prevBtn.disabled = data.page <= 1;
      nextBtn.disabled = data.page >= totalPages;

      if (!data.entries || data.entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No matching log records found for the applied filters.</td></tr>';
        return;
      }

      tbody.innerHTML = data.entries.map(e => {
        const reqDisplay = e.request_id
          ? `<span class="req-id" onclick="filterByRequestId('${escapeHtml(e.request_id)}')">${escapeHtml(e.request_id)}</span>`
          : `<span class="req-null">none</span>`;

        return `
          <tr>
            <td style="color: var(--text-muted); font-family: monospace;">#${e.id}</td>
            <td class="ts">${escapeHtml(e.timestamp.replace("T", " ").replace("Z", ""))}</td>
            <td><span class="badge badge-${escapeHtml(e.severity)}">${escapeHtml(e.severity)}</span></td>
            <td class="svc">${escapeHtml(e.service)}</td>
            <td>${reqDisplay}</td>
            <td class="msg">${escapeHtml(e.message)}</td>
          </tr>
        `;
      }).join("");
    }

    function filterByRequestId(reqId) {
      document.getElementById("request-id-input").value = reqId;
      fetchLogs(1);
    }

    function showError(msg) {
      const b = document.getElementById("error-banner");
      b.textContent = msg;
      b.style.display = "block";
    }

    function hideError() {
      const b = document.getElementById("error-banner");
      b.style.display = "none";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.getElementById("search-btn").addEventListener("click", () => fetchLogs(1));
    document.getElementById("reset-btn").addEventListener("click", () => {
      document.getElementById("severity-input").value = "";
      document.getElementById("request-id-input").value = "";
      document.getElementById("from-input").value = "";
      document.getElementById("to-input").value = "";
      document.getElementById("limit-input").value = "50";
      fetchLogs(1);
    });

    document.getElementById("prev-btn").addEventListener("click", () => {
      if (currentPage > 1) fetchLogs(currentPage - 1);
    });

    document.getElementById("next-btn").addEventListener("click", () => {
      fetchLogs(currentPage + 1);
    });

    // Enter key submits search on input fields
    document.getElementById("request-id-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") fetchLogs(1);
    });

    // Initial load
    fetchLogs(1);
  </script>
</body>
</html>
