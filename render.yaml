# render.yaml — Render "Blueprint" for Log Search & Analyzer
# =============================================================================
# One web service: FastAPI serves the API *and* the dashboard, so there is a
# single URL and no CORS split (see README "Architecture").
#
# Two ways to use this file:
#   A) Dashboard: New + -> Blueprint -> connect this repo. Render reads this
#      file and pre-fills everything below.
#   B) Manual:    New + -> Web Service and type the Build/Start commands in.
#      (This file is then just documentation — Render ignores it for manual
#      services except that it may offer to take over configuration.)
#
# Validate before pushing (requires Render CLI v2.7.0+):
#   render blueprints validate render.yaml
# =============================================================================

services:
  - type: web
    name: log-search-analyzer
    runtime: python

    # `free` = 0.1 CPU / 512 MB, spins down after 15 min idle (~1 min cold
    # start). Swap to `starter` ($7/mo) for an always-on demo.
    plan: free

    # Nearest region to Nigeria is Frankfurt (~120 ms RTT). Render's default
    # is oregon. Region is PERMANENT — pick before the first deploy.
    # Note: if the Free plan is not offered in your region, use `oregon`.
    region: frankfurt

    # Branch Render deploys from. Change to `develop` if that is your demo branch.
    branch: main

    buildCommand: pip install -r requirements.txt
    # $PORT must stay a variable — Render assigns the port and detects the
    # listening socket. 0.0.0.0 is required; 127.0.0.1 => "No open ports detected".
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Render marks the deploy live only when this returns 200 and uses it to
    # detect a crashed process. Lives in app/routers/analytics.py.
    healthCheckPath: /api/health

    envVars:
      # Leave EMPTY to use SQLite (logs.db) — data is wiped on every redeploy /
      # spin-down because Render's filesystem is ephemeral. Recommended: create
      # a Postgres DB (Render Free, or Neon/Supabase free) and paste its
      # INTERNAL connection string here. The app rewrites `postgres://` to
      # `postgresql://` for you, and seeds the schema automatically at startup.
      - key: DATABASE_URL
        sync: false

      # Seeds the 17 demo entries on startup when the DB is empty, so the
      # dashboard is never blank after a redeploy/spin-down.
      - key: SEED_ON_START
        value: "true"

      - key: MAX_UPLOAD_MB
        value: "5"

      # Same-origin deployment: the browser loads the UI from this service and
      # calls /api/* on it, so no cross-origin allowance is needed.
      # Tighten to your domain later, e.g. https://log-search-analyzer.onrender.com
      - key: CORS_ORIGIN
        value: "*"

# -----------------------------------------------------------------------------
# Optional: let the Blueprint create the database for you instead of pasting a
# connection string. Uncomment, and replace the DATABASE_URL block above with
# the `fromDatabase` form shown in the Render Blueprint docs.
# WARNING: a Render *Free* Postgres expires 30 days after creation and is
# deleted 14 days after that unless upgraded.
# -----------------------------------------------------------------------------
# databases:
#   - name: logsearch-db
#     databaseName: logsearch
#     plan: free
#     region: frankfurt
